# Tâche lm-eval personnalisée : AgentPublic/MCQ-eval, lue sur le jeu local pré-téléchargé
# (`slmsp fetch benchmarks`). Aucun accès réseau : `custom_dataset` lit le dossier donné par
# la variable d'environnement SLMSP_MCQ_EVAL_DIR (posée par le moteur lm_eval).
task: agentpublic_mcq
custom_dataset: !function utils.charger_jeu
output_type: multiple_choice
test_split: test
doc_to_text: "Question : {{question}}\nRéponse :"
doc_to_choice: "{{choix}}"
doc_to_target: "{{reponse}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
