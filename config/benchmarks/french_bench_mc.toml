# Benchmark du socle (addendum §E). lm_eval tourne hors ligne (HF_*_OFFLINE=1) et lit le cache HF
# local, rempli une fois en ligne (voir _bmad-output/implementation-artifacts/preparation-benchmarks-2026-10-16.md).
# Le jeu est figé par ce cache ; les révisions (SHA de commit) qu'il contient sont consignées dans
# [options.jeux_hf] (pas de [[jeux]] : `slmsp fetch` ne télécharge pas ces jeux).
nom = "french_bench_mc"
description = "Français général, QCM French Bench (3-shot), 500 questions par sous-tâche"
moteur = "lm_eval"
tache = "french_bench_mc_agrege"
fewshot = 3
limite = 500  # par sous-tâche (`--limit` de lm-eval) ; sans limite, ≈ 43 000 requêtes saturaient la RAM (17/10, garde mémoire) ; précision appariée suffisante pour SM-1
cible = "hf"
quantification = "avant"
socle = true

[options.jeux_hf]
"manu/french_bench_arc_challenge" = "25a80534368914cfd6aa4c5f73262d64ce2d61fb"
"manu/french_bench_hellaswag" = "f9f7e441f4a5c30863aa5a0ec09bbd1c3ab4f5e0"
"manu/french-bench-grammar-vocab-reading" = "dcbe950e3266f4a64e5ea35586d948a80faf3f18"
