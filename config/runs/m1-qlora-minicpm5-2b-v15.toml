# Run M1 sur v15 = v14 sans Q ni generique (tâches de rédaction libre) : test de la cause de la chute de LC (fidélité). Run autonome du 2026-10-20.
# Run M1, QLoRA (base 4 bits nf4 + LoRA), MiniCPM5-2B (campagne minicpm5-2b-v11, jeu v11 : cibles courtes régénérées par Mistral (stories 9.10, 9.11, 9.12) puis nettoyées (règle v2)).
# Mêmes hyperparamètres que les campagnes minicpm5-2b-v2 et v4 ; seul le jeu change (cibles
# plafonnées en mots par tâche, sans titre ni préambule en tête ; CR de retour).
# Garde mémoire (décision d'Anaël du 2026-10-19) : PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
# et surveillance de la RAM du PC (arrêt propre au-delà de 28 Go).
# Lancement : uv run --no-sync slmsp train run --config config/runs/m1-qlora-minicpm5-2b-v11.toml

campagne = "minicpm5-2b-v15-sans-q"
modele = "minicpm5-2b"
methode = "qlora"
jeu_version = "v15"
graine = 1234
longueur_max = 8192
precision_base = "bf16"

[hyperparametres]
lora_rang = 16
lora_alpha = 32
lora_dropout = 0.0
taux_apprentissage = 2e-4
epoques = 1.0
taille_lot = 1
accumulation = 8
planificateur = "cosine"
echauffement_ratio = 0.03
pas_sauvegarde = 100
