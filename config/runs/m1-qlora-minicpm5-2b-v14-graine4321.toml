# E1 (méthodologie v2, 2026-10-20) : variance d'entraînement. Même configuration que
# m1-qlora-minicpm5-2b-v14.toml (jeu v14, hyperparamètres du protocole), seule la graine change.
# Lancement : scripts-campagne\campagne-run.ps1 -Toml config/runs/m1-qlora-minicpm5-2b-v14-graine4321.toml

campagne = "minicpm5-2b-v14-e1"
modele = "minicpm5-2b"
methode = "qlora"
jeu_version = "v14"
graine = 4321
longueur_max = 8192
precision_base = "bf16"

[hyperparametres]
lora_rang = 16
lora_alpha = 32
lora_dropout = 0.0
taux_apprentissage = 2e-4
epoques = 1.0
taille_lot = 1
accumulation = 8
planificateur = "cosine"
echauffement_ratio = 0.03
pas_sauvegarde = 100
