# Run M4, ORPO après SFT (dérogation FR-34 : paires de préférence), Granite 4.0 1B (campagne granite-4.0-1b-v2, jeu v2).
# Gabarit de campagne : les quatre TOML m1 à m4 ne diffèrent que par `methode` (et
# `sft_run_id` pour ORPO).
# precision_base = bf16 dans les quatre (invariant de campagne). longueur_max = 3072 :
# sonde du 2026-10-19, QLoRA bf16 tient à 3072 (5,67 Gio, runs/train-sonde/20261019-080533-granite-4.0-1b-9da4),
# déborde à 4096 ; LoRA (M2) échoue dès 3072 (…-081835-granite-4.0-1b-6c4d) : M2 hors campagne.
# Lancement : uv run --no-sync slmsp train run --config config/runs/m4-orpo-granite-4.0-1b-v2.toml

campagne = "granite-4.0-1b-v2"
modele = "granite-4.0-1b"
methode = "orpo"
jeu_version = "v2"
graine = 1234
longueur_max = 3072
precision_base = "bf16"
# PROVISOIRE : remplacer par le run_id du run M1 terminé de cette campagne avant lancement.
sft_run_id = "00000000-000000-m1-qlora-granite-4.0-1b-v2-0000"

[hyperparametres]
lora_rang = 16
lora_alpha = 32
lora_dropout = 0.0
taux_apprentissage = 2e-4
epoques = 1.0
taille_lot = 1
accumulation = 8
planificateur = "cosine"
echauffement_ratio = 0.03
pas_sauvegarde = 100
orpo_beta = 0.1
