# Run M3, DoRA, MiniCPM5-2B (campagne minicpm5-2b-v4, jeu v4 nettoyé, story 9.9).
# Mêmes hyperparamètres que la campagne minicpm5-2b-v2 ; seul le jeu change (préambules
# « Voici » retirés, cibles de plus de 1 024 tokens écartées, donc plus de CR).
# Garde mémoire (décision d'Anaël du 2026-10-19) : PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
# et surveillance de la RAM du PC (arrêt propre au-delà de 28 Go).
# Lancement : uv run --no-sync slmsp train run --config config/runs/m3-dora-minicpm5-2b-v4.toml

campagne = "minicpm5-2b-v4"
modele = "minicpm5-2b"
methode = "dora"
jeu_version = "v4"
graine = 1234
longueur_max = 8192
precision_base = "bf16"

[hyperparametres]
lora_rang = 16
lora_alpha = 32
lora_dropout = 0.0
taux_apprentissage = 2e-4
epoques = 1.0
taille_lot = 1
accumulation = 8
planificateur = "cosine"
echauffement_ratio = 0.03
pas_sauvegarde = 100
