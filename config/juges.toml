# Juges du banc d'évaluation (AD-3, AD-12). Lu par `slmsp.judge.config.charger_juges`.
# Section `principal` : Juge principal Claude (story 5.4). Section `second` : second juge
# Mistral (story 5.5), qui renote l'échantillon du manifeste ; son délai d'appel est dans
# `config/mistral.toml`.

schema_version = 1

[principal]
# Juge principal : identifiant exact du modèle Anthropic (tarifé dans `tarifs.toml`).
modele = "claude-opus-5-5"
# Effort de raisonnement (`low`, `medium`, `high`, `xhigh`, `max`) ; à confirmer par la
# mesure H-JUGE-COUT à la Baseline. Fait partie de la clé du cache de verdicts.
effort = "medium"
# `batch` (Batch API, tarif -50 %, par défaut) ou `direct` (un appel par item).
mode_appel = "batch"
# Plafond de tokens de sortie d'un verdict ; sert aussi au coût pire cas réservé.
max_tokens = 6000
# Délai maximal d'un lot (secondes) : au-delà, le lot est annulé et les items restants
# passent en appels directs.
delai_max_lot = 3600
# Pause entre deux relevés de l'état d'un lot (secondes).
intervalle_sondage = 60
# Délai d'attente de la confirmation d'une annulation de lot (secondes) ; au-delà, le lot
# reste ouvert et ses items sont marqués non jugés.
delai_annulation = 600
# Délai d'un appel HTTP à l'API (secondes), passé au client `anthropic`.
delai_appel = 600
# Usage de budget déclaré dans `budgets.toml` (poste `anthropic`).
usage_budget = "juge-principal"
# Grille du Juge, relative à la racine du dépôt (lecture seule).
grille = "eval/grille-juge-v1.md"

[second]
# Second juge : modèle Mistral demandé (doit figurer dans la liste stable de `mistral.toml` et
# être tarifé dans `tarifs.toml`). Fait partie de la clé du cache de verdicts.
modele = "mistral-large-latest"
# Température d'échantillonnage : 0 pour un verdict aussi déterministe que possible. Seule
# valeur admise : la clé du cache (`effort_cache`) la suppose.
temperature = 0.0
# Plafond de tokens de sortie d'un verdict ; sert aussi au coût pire cas réservé.
max_tokens = 4000
# Usage de budget déclaré dans `budgets.toml` (sous-poste `mistral.juge`) ; il route aussi
# l'appel vers le journal du juge (`appels-mistral-juge.sqlite`). Seule valeur admise : tout
# autre usage enverrait les prompts d'évaluation dans un journal lisible par `data` et `train`.
usage_budget = "juge-second"
# Valeur tenant lieu d'effort dans la clé du cache de verdicts, suivie de `+<format_reponse>` :
# le second juge n'a pas d'effort de raisonnement, il est réglé par sa température.
effort_cache = "temperature-0"
# Format de réponse demandé : `json_schema` (schéma strict du Juge principal) ou
# `json_object` (JSON libre, validé ensuite contre le même schéma).
format_reponse = "json_schema"
