# Budgets durs des API payantes (D1.6, AD-5), en euros. Relevé : `uv run slmsp budget etat`.
# Le registre (`SLMSP_VAR_DIR/budget.sqlite`) est unique par machine et ne se remet jamais
# à zéro : changer `campagne_id` démarre une nouvelle campagne, les lignes anciennes restent
# en base hors des totaux.
# Fichier daté du 2026-10-12.

schema_version = 1

# Campagne baseline-2026-10-16 close le 2026-10-17 avec : anthropic 8,49 € et mistral 6,17 € (génération
# 5,51 €, juge 0,66 €) dépensés. Le registre interdit de changer un plafond en cours de campagne : la
# campagne suivante reprend les plafonds approuvés par Anaël, diminués de ces dépenses.
# Campagne baseline-2026-10-17 close le 2026-10-18 avec : anthropic 7,89 € et mistral 11,29 € (génération
# 10,64 €, juge 0,65 €) dépensés. Le reste anthropic (2,21 €) ne couvrait pas une notation : Anaël a approuvé
# le 2026-10-17 une nouvelle campagne de 5 € pour anthropic, sans aller au-delà.
# Campagne baseline-2026-10-18 close le 2026-10-18 avec : anthropic 2,86 € et mistral 0,22 € (juge) dépensés.
# Anaël a approuvé le 2026-10-18 une nouvelle enveloppe de 6 € (anthropic) pour la Baseline de MiniCPM5-2B.
# Campagne baseline-2026-10-18b close le 2026-10-18 avec : anthropic 2,91 € et mistral 0,21 € (juge) dépensés.
# Anaël a approuvé le 2026-10-18 : reste de 3,09 € reporté, + 2 € (Granite 4.0 350M) et + 5 € (Granite 4.0 H
# 350M et H 1B), soit 10,09 € pour anthropic.
# Campagne baseline-2026-10-18c close le 2026-10-18 avec : anthropic 7,00 € et mistral 1,26 € (juge) dépensés.
# Anaël a approuvé le 2026-10-18 au soir : reste de 3,09 € reporté + 12 € pour noter les quatre runs de la campagne
# MiniCPM5-2B (M1 à M4), soit 15,09 € pour anthropic.
# Campagne finetune-minicpm5-2b-2026-10-19 close le 2026-10-19 avec : anthropic 9,43 € et mistral 5,33 €
# (génération 4,54 €, juge 0,80 €) dépensés. Anaël a approuvé le 2026-10-19 au soir la campagne complète
# v9 (M1, M3, M4 sur MiniCPM5-2B, Qwen3.5-2B et Qwen3.5-0.8B ; Granite 1B en réserve) : 30 € pour
# anthropic (9 notations ≈ 27 €, avec --plafond-estime 4.5 par notation) ; mistral reporte son reste
# (régénération des cibles autorisée jusqu'à 10 € au total le 2026-10-19).
campagne_id = "finetune-v9-2026-10-19"

# Marge de sécurité (EUR) ajoutée à chaque contrôle, au poste comme au sous-poste : une
# réservation est refusée si dépensé + réservé + coût pire cas + marge > plafond.
# Valeur prise seule pendant le run de nuit (solution prudente et réversible).
marge_eur = 0.5

# Majoration des tokens d'entrée estimés pour le coût pire cas (1,25 = +25 %).
majoration_entree = 1.25

[postes.anthropic]
# PRD : 10 €. Relevé par Anaël le 2026-10-16 et le 2026-10-17 (10 $ ≈ 8,6 € + 5 € + 5 €), Baseline
# complète et trois nouveaux Modèles de base candidats.
plafond_eur = 30.0  # campagne complète v9, approuvée par Anaël le 2026-10-19 au soir

[postes.mistral]
plafond_eur = 5.36  # reste reporté : 10,80 € − 5,33 € dépensés le 2026-10-19 (arrondi)

# Sous-plafonds de Mistral : la génération ne peut pas affamer le second juge.
[postes.mistral.sous_postes]
generation = 4.21  # reste reporté : 8,75 € − 4,54 € (2026-10-19)
juge = 1.15  # reste reporté : 1,95 € − 0,80 € (2026-10-19)

# Imputation des usages : "poste" ou "poste.sous_poste".
[imputations]
generation = "mistral.generation"
validation = "mistral.generation"
juge-second = "mistral.juge"
juge-principal = "anthropic"
