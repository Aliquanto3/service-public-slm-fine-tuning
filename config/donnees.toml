# Blocs détectables d'un CT, dans l'ordre attendu (recherche ligne par ligne, casse ignorée).
# Expéditeur et destinataire, non détectables de façon fiable, sont laissés au juge.
[verification.ct_blocs]
# Bloc lieu_date.
lieu_date = '^[^\n]{0,60}\ble\s+(?:\[[^\]\n]+\]|\d{1,2}(?:er)?\s+[^\W\d_]+\s+\d{4}|\d{1,2}/\d{1,2}/\d{4})[ .*_]*$'
# Bloc objet.
objet = '^[#*_\s]*objet\b[^\n:]{0,40}:'
# Bloc references.
references = '^[#*_\s\[]*(?:[nv]\s*/\s*|vos\s+|nos\s+)?r[ée]f(?:[ée]rences?|\.)?(?![^\W_])'
# Bloc appel.
appel = '^[#*_\s]*(?:madame|monsieur|mesdames|messieurs|ma[iî]tre|docteur|\[[^\]\n]*(?:civilit|appel)[^\]\n]*\])[^\n]{0,60},[*_\s]*$'
# Bloc politesse.
politesse = '\b(?:agr[ée]er|salutations|consid[ée]ration|sentiments|cordialement|respectueusement)\b'
# Bloc signature.
signature = '^[#*_\s]*(?:\[[^\]\n]*(?:signat|nom|qualit|fonction|pr[ée]nom)[^\]\n]*\]|l[ea]\s+\S+|p\.?\s*o\.?\s|pour\s+l[ea]\b|sign(?:[ée]|ature\b))'
