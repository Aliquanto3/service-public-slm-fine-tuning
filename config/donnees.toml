# Pipeline de données (AD-17, D1.2, D4). Lu par `slmsp.data.config.charger_config_donnees`.
# La table [mistral] est aussi lue par `slmsp.mistral.generateur.charger_prealables`.

# Version du format de ce fichier (seule valeur admise : 1).
schema_version = 1

# Préalables du Générateur Mistral (D1.2). La campagne relit la page des conditions par GET
# (profil réseau `outillage`) puis inscrit ici la date, l'URL et le SHA de la page.
[mistral]
# Date (TOML, AAAA-MM-JJ) de vérification des conditions commerciales de Mistral. Le
# Générateur refuse de démarrer si elle n'est pas égale au jour même. Chaîne vide tant que
# la vérification n'a pas été faite : la génération est alors refusée. Renseignée si et
# seulement si `conditions_sha256` l'est aussi.
conditions_verifiees_le = 2026-10-20
# Méthode de vérification des conditions (texte libre consigné au MANIFEST).
methode_verification = "GET de la page des conditions par slmsp.net.client('outillage'), SHA-256 des octets reçus"
# Page des conditions commerciales relue (seule URL admise par le profil `outillage`).
conditions_url = "https://legal.mistral.ai/terms/commercial-terms-of-service/"
# SHA-256 (64 caractères hexadécimaux) de la page relue ; chaîne vide tant qu'elle ne l'a pas été.
# Renseigné si et seulement si `conditions_verifiees_le` l'est aussi.
conditions_sha256 = "08ee882d26552c28006ebb288772fad817a6e6dea7cd8aed771480123cd0d94e"
# Modèles Mistral stables admis comme générateur (même liste que `modeles_autorises` de
# `config/mistral.toml`) : ni modèle Labs, ni préversion. Une préversion admise pour le
# Générateur seul figure dans `modeles_preversion_generateur` de `config/mistral.toml` (S5).
modeles_stables = ["mistral-large-latest", "mistral-large-2411", "mistral-large-2512"]

# Volumes cibles de la nuit par Tâche (nombre d'exemples SFT). Traduction exclue : aucune
# autre clé n'est admise. La part `generique` doit rester entre 10 % et 20 % du total (D4).
[volumes]
# Question.
Q = 100
# Recherche de données (traces d'outils MCP).
RD = 140
# Compte rendu.
CR = 80
# Langage clair.
LC = 80
# Correction.
CO = 35
# Résumé.
RE = 35
# Courrier type.
CT = 35
# Exemples génériques (hors Tâches métier).
generique = 90

# Doublons exacts et proches entre exemples générés (étape `filter`, motif `doublon`).
[deduplication]
# Taille des n-grammes de mots normalisés.
n_ngrammes = 5
# Similarité de Jaccard au-delà de laquelle deux exemples sont des doublons, dans ]0, 1].
seuil_jaccard = 0.8

# Anti-fuite du Jeu d'évaluation (étape `filter`, motifs `fuite_ngram` et `fuite_cosinus`).
[anti_fuite]
# Taille des n-grammes hachés (même valeur que `slmsp.core.items.N_DEFAUT`).
n_ngrammes = 5
# Seuil de recouvrement de n-grammes hachés au-delà duquel un exemple est exclu, dans ]0, 1].
# Malgré le nom de la clé, `seed` et `filter` calculent le coefficient d'inclusion
# |A ∩ B| / min(|A|, |B|) (`Protection.recouvrement`), pas le Jaccard : plus strict pour les
# textes courts (sur-rejet assumé côté anti-fuite). Calibration sur le jeu réel à faire (9.8).
seuil_jaccard = 0.5
# Cosinus BGE-M3 au-delà duquel un exemple est exclu, dans ]0, 1].
seuil_cosinus = 0.9

# Échantillon de relecture humaine (non bloquant).
[relecture]
# Nombre d'exemples tirés pour la relecture.
taille_echantillon = 30
# Graine du tirage, pour un échantillon reproductible.
graine = 42

# Étape `seed` : paramètres sans contenu (aucune amorce n'est écrite ici, D1.1).
[seed]
# Longueurs de résumé proposées à l'emplacement RE/longueur_demandee, avec les mêmes mots que le
# Jeu d'évaluation (clés de [re.longueurs] de evaluation.toml, sans accent) : chaque texte RE
# reçoit une longueur tirée dans cette liste (texte de l'amorce : la valeur elle-même).
re_longueurs = ["courte", "moyenne", "detaillee"]
# Graine du tirage (une même amorce de texte reçoit toujours la même longueur).
graine = 42

# Paires ORPO (story 9.7) : génération locale de la réponse rejetée par le Modèle de base.
[preferences]
# Graine de base ; la paire de rang i utilise graine + i.
graine = 42
# Température d'échantillonnage du Modèle de base local.
temperature = 0.8
# Longueur maximale de la réponse rejetée, en tokens.
max_tokens = 1024

# Générateur (story 9.10) : plafond de mots de la réponse cible, par Tâche, envoyé à Mistral
# comme consigne de longueur (emplacement plafond_mots_tache des gabarits). Une consigne de
# forme seulement : elle n'entre jamais dans les exemples d'entraînement (D1.1).
# CO n'a pas de plafond (sa longueur suit le texte à corriger) ; RE garde plafond_mots,
# dérivé de longueur_demandee.
[generateur.plafonds_mots]
# p90 des références Q du Jeu d'évaluation : 165 mots.
Q = 160
# p90 des références RD du Jeu d'évaluation : 108 mots.
RD = 120
# Reste sous les 1 024 tokens du plafond de nettoyage (data build --nettoyage).
CR = 400
# Sans référence mesurable : estimation de l'orchestrateur, à ajuster.
LC = 150
# Format administratif complet (story S5) : neuf blocs (expéditeur, destinataire, lieu et
# date, objet, références, appel, corps, politesse, signature), dont environ 60 mots d'en-tête
# et de formules, plus un corps de 150 à 190 mots ; v11 (format incomplet) : médiane 152 mots.
CT = 250
# Idem (generique, sans référence mesurable).
generique = 200

# Juge de données (story O1, `slmsp data juger`) : DeepSeek via OpenRouter note les candidats
# d'entraînement selon `config/prompts/juge-donnees/<tache>.md`. Même modèle que
# `[juges_tiers.deepseek]` de `config/juges.toml` (vérifié par un test). Sortie structurée
# seulement : le juge ne produit jamais de cible (D1).
[juge_donnees]
# Modèle OpenRouter du juge (même valeur que [juges_tiers.deepseek].modele de juges.toml).
modele = "deepseek/deepseek-v4-pro"
# Température d'échantillonnage (0 : notation reproductible).
temperature = 0.0
# Tokens de sortie maximum, raisonnement compris ; réservés au registre à chaque appel (pire cas).
# DeepSeek V4 Pro raisonne 7 500 à 8 000 tokens même en effort low : à 8 000, un quart des CR
# étaient coupés (constat C7, juges tiers portés à 16 000).
max_tokens = 16000
# Effort de raisonnement envoyé en `reasoning.effort`.
effort_raisonnement = "low"
# Format de réponse : schéma JSON strict par Tâche.
format_reponse = "json_schema"
# Tokens de sortie estimés par candidat (estimation affichée avant lancement).
sortie_estimee = 1500
# Tokens de raisonnement ajoutés à l'estimation (7 500 à 8 000 observés en effort low, C7).
marge_raisonnement = 8000
# Usage de budget (imputé au poste openrouter, config/budgets.toml).
usage_budget = "juge-donnees-openrouter"
# Délai de lecture HTTP (s) : DeepSeek V4 Pro met ~2,8 min par appel (calibrage O1), le défaut
# du client (300 s) coupait l'appel.
delai_lecture = 900.0
# Délai total d'une tentative (s).
delai_appel = 900.0
# Durée maximale d'un appel, réessais compris (s), au moins delai_appel.
duree_totale_max_appel = 1800.0
# Jugements menés en parallèle (data juger, data generate --verifiee), verdicts écrits dans l'ordre.
appels_paralleles = 8

# Seuils d'acceptation (note >= seuil pour chaque critère), alignés sur les scores du test.
# Fusion par critère avec les défauts du code : un critère omis garde son seuil par défaut ;
# une Tâche dont tous les seuils sont nuls est refusée au chargement.
# CR : `couverture` est le rappel des décisions et actions (partielle = 1/2), calculé par le code.
[juge_donnees.seuils.CR]
# Aucune invention (0/1).
invention = 1
# Sections Participants, Points abordés, Décisions et Actions présentes (0/1).
structure = 1
# Rappel minimal des décisions et actions de la transcription, dans [0, 1].
couverture = 0.8

[juge_donnees.seuils.LC]
# Fidélité complète (0/1/2).
fidelite = 2
# Termes juridiques gardés ou expliqués (0/1).
termes = 1

[juge_donnees.seuils.CT]
# Format administratif complet (0/1/2).
conformite = 2
# Aucune invention (0/1).
invention = 1

# Alignement entraînement / évaluation (story O5). À l'évaluation, chaque item des Tâches CR, LC,
# CT, RE et CO porte une consigne d'Agent rendue par `harness.prompts` (« Consigne : … ») ; à
# l'entraînement ce message n'avait que le texte. Les formulations ci-dessous sont des consignes
# génériques d'outillage (ni réponses ni exemples, D1) ; l'une d'elles est tirée par graine pour
# chaque session. Une Tâche absente n'a pas de consigne.
[alignement]
# Graine du tirage de la consigne : une même session reçoit toujours la même.
graine = 42

[alignement.consignes_agent]
# Formulations d'outillage neutres, sans exemple de réponse (D1). Aucune ne doit ressembler à une
# consigne du Jeu d'évaluation (difflib < 0,6, ni préfixe) : `tests/data/test_alignement_o5.py`.
# Langage clair.
LC = [
  "Tâche : mise en langage clair du texte fourni, destinée au grand public.",
  "Objectif : version accessible à tout public du texte suivant, contenu inchangé.",
  "Objectif : lisibilité maximale pour tout public, aucune information perdue.",
  "Adapter le texte suivant pour un lecteur non spécialiste.",
]
# Compte rendu.
CR = [
  "Tâche : compte rendu des notes fournies.",
  "Objectif : produire le compte rendu à partir des notes suivantes.",
  "Synthétiser les notes suivantes sous forme de compte rendu.",
]
# Courrier type.
CT = [
  "Tâche : courrier type à partir des éléments fournis.",
  "Objectif : produire le courrier correspondant aux éléments indiqués.",
  "Établir le courrier demandé à partir des champs suivants.",
]
# Résumé.
RE = [
  "Tâche : résumé du document fourni.",
  "Objectif : synthèse fidèle du document suivant.",
  "Condenser le document suivant en conservant l'essentiel.",
]
# Correction.
CO = [
  "Tâche : élimination des fautes d’accord et de frappe, contenu intact.",
  "Objectif : texte suivant corrigé, sans autre modification.",
  "Supprimer les fautes du texte suivant, sans le réécrire.",
]

# Longueur des textes sources LC : médiane de l'entrée LC du Jeu d'évaluation (278 mots,
# statistique de `outils/comparer_entrainement_evaluation.py`), contre 108 mots à l'entraînement
# en v14. Le seed ne garde que les textes entiers dans médiane ± tolerance (aucune troncature).
[alignement.longueur_sources_lc]
# Médiane (mots) de l'entrée LC du Jeu d'évaluation.
mediane_mots = 278
# Écart relatif admis autour de la médiane (0,3 = ± 30 %).
tolerance = 0.3

# Génération vérifiée (story O6a, `slmsp data generate --verifiee`) : contrôles déterministes des
# cibles CR, LC, CT avant le juge de données (`slmsp.data.verification`). Règles d'outillage
# (expressions régulières, listes de mots), jamais un exemple de réponse (D1). Les codes partagés
# avec `validate` (url_inventee, valeur_absente, cr_sections_manquantes, ct_format_incomplet,
# lc_valeur_perdue) restent toujours bloquants.
[verification]
# Essais par session au total (story O6b) : la cible refusée est régénérée par Mistral avec ses
# motifs de refus (gabarits *-correction) au plus essais_max - 1 fois. 1 : aucune régénération
# (calibrage, `--essais-max 1`).
essais_max = 3
# Gain de Kandel-Moles minimal d'une cible LC (copie de gain_km_min de evaluation.toml).
gain_km_min = 10.0
# Graine des tirages de echantillon.md et calibrage.md.
graine = 42
# Cibles retenues tirées par Tâche (et cibles écartées) dans echantillon.md.
echantillon = 5
# Refus des contrôles tirés dans calibrage.md, relus avant le run payant.
calibrage = 20
# Codes non bloquants (transmis au juge et au rapport). nom_absent le reste jusqu'au calibrage ;
# un code dont plus de 20 % des refus relus sont des faux positifs y est ajouté.
non_bloquants = [
  'nom_absent',
]
# Mots capitalisés jamais tenus pour des noms propres (casse et accents ignorés) : titres de
