# Dossier de publication (story 13.7, FR-37, décision Q8). Lu par `slmsp publication preparer`.
# Le code prépare un dossier hors ligne ; Anaël le téléverse lui-même (docs/procedure-publication.md).

schema_version = 1

# Versions du Jeu d'évaluation maison dont aucun texte ne doit figurer dans le dossier (AD-11).
jeux_proteges = ["v1.0", "v1.1", "calibrage"]

# Licences de sortie, de la plus permissive à la moins permissive. Le texte de chacune est
# `config/licences/<id>.txt` ; une licence sans texte fait échouer la préparation.
ordre_permissivite = ["apache-2.0"]

# Fiche : sections qui doivent exister (titres de niveau 2) et mention de non-certification.
sections_obligatoires = [
    "Données utilisées et Registre des licences",
    "Résultats d'évaluation",
    "Limites et usages déconseillés",
    "Non-certification",
]
mention_non_certification = "Ce modèle ne bénéficie d'aucune certification ni d'aucune attestation de conformité."

# Formulations de certification refusées (expressions régulières, insensibles à la casse).
formulations_interdites = [
    '\bcertifi(?:e|é|ée|és|ées|er|ent|ons|cation|cations)\b',
    '\bcertified\b',
    '\bISO\s*/?\s*(?:IEC\s*)?42001\b',
    '\bconform(?:e|es|é|ée|és|ées|ité|ités)\b',
    '\batteste?(?:r|nt|é|ée|és|ées)?\b',
    '\battestations?\b',
    '\bhomologu(?:e|er|é|ée|és|ées|ation|ations)\b',
    '\blabel+is',
]
# Chaque occurrence de l'une de ces mentions (insensible à la casse) est retirée du texte avant la
# recherche des formulations interdites ; seule la mention est admise, pas le reste de la phrase.
# Une mention de « certifié » peut être suivie de « ISO 42001 » (« n'est pas certifié ISO 42001 »).
mentions_non_certification = [
    "aucune certification",
    "aucune attestation de conformité",
    "n'est pas certifié",
    "non certifié",
    "non-certification",
]

# Motifs de secrets refusés dans les fichiers texte du dossier.
motifs_secrets = [
    '\bsk-[A-Za-z0-9_-]{20,}',
    '\bhf_[A-Za-z0-9]{20,}',
    '(?i)\b(?:MISTRAL|ANTHROPIC|HF)_?(?:API_)?(?:KEY|TOKEN)\s*=',
]

# Licence du Modèle de base : licences de sortie compatibles, déclarées. `verifie_le` reste
# absent tant qu'Anaël n'a pas relu la licence sur la fiche Hugging Face du modèle : la
# préparation refuse alors le dossier. Valeurs de départ : À CONFIRMER PAR ANAËL.
[modeles."granite-4.0-1b"]
licences_compatibles = ["apache-2.0"]
verifie_le = 2026-10-17  # métadonnée license:apache-2.0 de la fiche HF, relevée par l'orchestrateur ; À VALIDER PAR ANAËL

[modeles."ministral-3-3b"]
licences_compatibles = ["apache-2.0"]
verifie_le = 2026-10-17  # métadonnée license:apache-2.0 de la fiche HF, relevée par l'orchestrateur ; À VALIDER PAR ANAËL

[modeles."qwen-4b"]
licences_compatibles = ["apache-2.0"]
verifie_le = 2026-10-17  # métadonnée license:apache-2.0 de la fiche HF, relevée par l'orchestrateur ; À VALIDER PAR ANAËL

[modeles."smollm3-3b"]
licences_compatibles = ["apache-2.0"]
verifie_le = 2026-10-17  # métadonnée license:apache-2.0 de la fiche HF, relevée par l'orchestrateur ; À VALIDER PAR ANAËL

# Ajoutés le 2026-10-17 (spec-modeles-octobre-2026) : Apache 2.0 lu sur la fiche Hugging Face.
# bonsai-2-4b (Apache 2.0, dérivé de Qwen3.5-4B) n'a pas d'entrée : non entraînable, aucun
# modèle fine-tuné à publier.
[modeles."qwen3.5-2b"]
licences_compatibles = ["apache-2.0"]

[modeles."minicpm-v-4.7-1b"]
licences_compatibles = ["apache-2.0"]

# Ajoutés le 2026-10-17 (seconde campagne, spec-modeles-octobre-2026) : Apache 2.0 lu sur la
