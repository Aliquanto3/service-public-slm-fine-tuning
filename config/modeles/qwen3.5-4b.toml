# Qwen3.5 4B (post-entraîné, Apache 2.0, sans accès conditionnel) : ajouté par décision
# d'Anaël du 2026-10-21 comme professeur possible d'une distillation des logits vers
# Qwen3.5-0.8B et 2B (même tokenizer.json, SHA identique) ; d'abord mesuré sur dev1.
# Révisions, SHA-256 et tailles relevés le 2026-10-21 via l'API Hugging Face (fichiers
# hors LFS hachés après téléchargement à la révision épinglée). AD-6 : valeurs communes à
# l'inférence et à l'entraînement.
# Même architecture que Qwen3.5-2B (VLM, Gated DeltaNet `linear_attention` + `full_attention`,
# 3 pour 1), 32 couches au lieu de 24. Pas candidat au fine-tuning (règle de taille de D8).
# GGUF communautaire réputé (unsloth) : Qwen ne publie pas de GGUF pour ce modèle.

schema_version = 1
depot_hf = "Qwen/Qwen3.5-4B"
revision = "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
fichiers = [
    "chat_template.jinja",
    "config.json",
    "merges.txt",
    "model.safetensors-00001-of-00002.safetensors",
    "model.safetensors-00002-of-00002.safetensors",
    "model.safetensors.index.json",
    "preprocessor_config.json",
    "tokenizer.json",
    "tokenizer_config.json",
    "video_preprocessor_config.json",
    "vocab.json",
]
contexte = 8192
cache_kv = "f16"
reasoning = "off"
chat_template_kwargs = { enable_thinking = false }
exclure_vision = true
# Non sondé (sonde H-TOOLS 8.2 à lancer) : natif par défaut, comme qwen3.5-2b.
protocole_outils = "natif"
# Comme qwen3.5-2b : le template HF, exporté sous models/<slug>/chat_template.jinja, est
# imposé à llama-server (à confirmer par le contrôle chat_template du fetch).
chat_template_force = true
# Mêmes réglages de masque que qwen3.5-2b (même template), utiles au calcul des logits du
# professeur sur les conversations d'entraînement.
decoupage_masque = "par-tour"
bloc_amorce = "<think>\n\n</think>\n\n"
bloc_amorce_historique = true

