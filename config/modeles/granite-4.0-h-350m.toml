# Granite 4.0 H 350M (IBM), variante hybride Mamba-2 (`granitemoehybrid`, 4 couches d'attention sur 32).
# Ajouté pour la Baseline le 2026-10-18 (décision D8 d'Anaël, decisions.md : Granite 4.0 H admis
# quand llama.cpp les sert sous Windows). Révisions, SHA-256 et tailles relevés le même jour via
# l'API Hugging Face. AD-6 : valeurs communes à l'inférence et à l'entraînement.
# Couches `mamba` : admises pour l'inférence et la Baseline seulement, d'où `entrainable = false`
# (le contrôle `dense` l'exige) ; l'entraînement sera rouvert après l'enquête WSL2.

schema_version = 1
depot_hf = "ibm-granite/granite-4.0-h-350m"
revision = "3b17b717b8f2f5d305b0a92c1491e239aeda19c8"
fichiers = [
    "chat_template.jinja",
    "config.json",
    "generation_config.json",
    "merges.txt",
    "model.safetensors",
    "special_tokens_map.json",
    "tokenizer.json",
    "tokenizer_config.json",
    "vocab.json",
]
# Contexte de granite-4.0-1b conservé (8192) : le natif est plus large (32 768 / 131 072),
# 8192 borne la KV cache sur le portable.
contexte = 8192
cache_kv = "f16"
reasoning = "off"
chat_template_kwargs = {}
# Non sondé (sonde H-TOOLS 8.2) : natif par défaut, template Granite 4.0 identique à celui de
# granite-4.0-1b. `chat_template_force` : à confirmer par le contrôle `chat_template` de
# `slmsp fetch modeles` (false chez granite-4.0-1b).
protocole_outils = "natif"
chat_template_force = false
# lm_eval sur HF bf16, portable de 6 Go de VRAM : `auto` provoque des OOM CUDA. Valeur
# prudente (jamais `auto`), à confirmer par mesure.
lm_eval_batch_size = 4
# Baseline seulement (D8, révision du 2026-10-18) : `train run` refuse ce modèle.
entrainable = false

