# CroissantLLMChat v0.1 (CroissantLLM, MIT, sans accès conditionnel) : candidat de moins de
# 2B ajouté par décision d'Anaël du 2026-10-17 (spec-modeles-octobre-2026, « Candidats < 2B »).
# Révisions, SHA-256 et tailles relevés le même jour via l'API Hugging Face. AD-6 : valeurs
# communes à l'inférence et à l'entraînement.
# Architecture `llama` dense (1,3 Md), bilingue fr-en, poids HF en float32. Contexte natif
# de 2048 jetons (max_position_embeddings) : très inférieur à 8192, le prompt RAG de la
# Tâche Q risque de ne pas tenir (point bloquant, voir la spec).
# GGUF du dépôt officiel de l'éditeur (Q4_K_M seul : pas de F16).
# Template ChatML dans tokenizer_config.json ; pas de mode raisonnement.

schema_version = 1
depot_hf = "croissantllm/CroissantLLMChat-v0.1"
revision = "f05665c340c868ce48cebdf997cfafb7dbfef2b3"
fichiers = [
    "config.json",
    "generation_config.json",
    "model-00001-of-00002.safetensors",
    "model-00002-of-00002.safetensors",
    "model.safetensors.index.json",
    "special_tokens_map.json",
    "tokenizer.json",
    "tokenizer_config.json",
]
contexte = 2048
cache_kv = "f16"
reasoning = "off"
exclure_vision = false
# Non sondé (sonde H-TOOLS 8.2) : natif par défaut.
protocole_outils = "natif"
chat_template_force = false
# lm_eval sur HF bf16, portable de 6 Go de VRAM : `auto` provoque des OOM CUDA. Valeur
# prudente (jamais `auto`), à confirmer par mesure.
lm_eval_batch_size = 2

