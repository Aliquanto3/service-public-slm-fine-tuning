# CANDIDAT AU FINE-TUNING depuis le 2026-10-18 (règle de taille relevée à 2,5B par Anaël, après
# sa Baseline). Écarté le 2026-10-17 (taille > 2B), puis réintégré comme référence de Baseline.
# MiniCPM5 2B (OpenBMB, Apache 2.0, sans accès conditionnel) : candidat ajouté par décision
# d'Anaël du 2026-10-17 (spec-modeles-octobre-2026). Révisions, SHA-256 et tailles relevés
# le 2026-10-17 via l'API Hugging Face. AD-6 : valeurs communes à l'inférence et à
# l'entraînement.
# Architecture `llama` dense, texte seul : rien à exclure côté vision.
# Le template ouvre un bloc de raisonnement ; enable_thinking = false est imposé.

schema_version = 1
depot_hf = "openbmb/MiniCPM5-2B"
revision = "f97400052a43d642bbc6e9975e2397e3ae6a6b52"
fichiers = [
    "chat_template.jinja",
    "config.json",
    "generation_config.json",
    "model-00000-of-00001.safetensors",
    "model.safetensors.index.json",
    "special_tokens_map.json",
    "tokenizer.json",
    "tokenizer_config.json",
]
contexte = 8192
cache_kv = "f16"
# lm_eval sur HF bf16, portable de 6 Go : batch fixe (jamais `auto`) ; minicpm5-1b monte à 5 063 Mio
# en batch 4, le 2B (2,5 fois plus de paramètres) part à 2.
lm_eval_batch_size = 2
reasoning = "off"
chat_template_kwargs = { enable_thinking = false }
exclure_vision = false
# Non sondé (sonde H-TOOLS 8.2) : natif par défaut.
protocole_outils = "natif"
# Template GGUF différent de celui du tokenizer HF (contrôle chat_template, run
# fetch/20261017-061650-modeles-6ca4) : le template HF, exporté sous models/<slug>/
# chat_template.jinja, est imposé à llama-server.
chat_template_force = true

