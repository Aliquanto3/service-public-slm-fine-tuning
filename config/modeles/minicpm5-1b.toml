# MiniCPM5 1B (OpenBMB, Apache 2.0, sans accès conditionnel) : candidat ajouté par décision
# d'Anaël du 2026-10-17 (spec-modeles-octobre-2026). Révisions, SHA-256 et tailles relevés
# le 2026-10-17 via l'API Hugging Face. AD-6 : valeurs communes à l'inférence et à
# l'entraînement.
# Architecture `llama` dense, texte seul : rien à exclure côté vision.
# Le template ouvre un bloc de raisonnement ; enable_thinking = false est imposé.

schema_version = 1
depot_hf = "openbmb/MiniCPM5-1B"
revision = "87179e5c1f455ef22e6223592d2d61351b525bfc"
fichiers = [
    "chat_template.jinja",
    "config.json",
    "generation_config.json",
    "model-00000-of-00001.safetensors",
    "model.safetensors.index.json",
    "special_tokens_map.json",
    "tokenizer.json",
    "tokenizer_config.json",
]
contexte = 8192
cache_kv = "f16"
reasoning = "off"
chat_template_kwargs = { enable_thinking = false }
exclure_vision = false
# Non sondé (sonde H-TOOLS 8.2) : natif par défaut.
protocole_outils = "natif"
chat_template_force = false
# lm_eval sur HF bf16, carte de 8 Go : `auto` provoque des OOM CUDA (belebele, french_bench_mc).
# Valeur prudente, à confirmer par mesure.
lm_eval_batch_size = 4

