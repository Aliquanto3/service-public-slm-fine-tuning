# Granite 4.0 350M (IBM), variante dense (`granitemoehybrid`, 28 couches d'attention, aucune couche Mamba).
# Ajouté pour la Baseline le 2026-10-18 (décision D8 d'Anaël, decisions.md) ; entraînable : même
# architecture que granite-4.0-1b. Révisions, SHA-256 et tailles relevés le même jour via l'API
# Hugging Face. AD-6 : valeurs communes à l'inférence et à l'entraînement.

schema_version = 1
depot_hf = "ibm-granite/granite-4.0-350m"
revision = "bd8a1497065c0d6ba1ef19af6b0d2b14bacf71c2"
fichiers = [
    "chat_template.jinja",
    "config.json",
    "generation_config.json",
    "merges.txt",
    "model.safetensors",
    "special_tokens_map.json",
    "tokenizer.json",
    "tokenizer_config.json",
    "vocab.json",
]
# Contexte de granite-4.0-1b conservé (8192) : le natif est plus large (32 768 / 131 072),
# 8192 borne la KV cache sur le portable.
contexte = 8192
cache_kv = "f16"
reasoning = "off"
chat_template_kwargs = {}
# Non sondé (sonde H-TOOLS 8.2) : natif par défaut, template Granite 4.0 identique à celui de
# granite-4.0-1b. `chat_template_force` : à confirmer par le contrôle `chat_template` de
# `slmsp fetch modeles` (false chez granite-4.0-1b).
protocole_outils = "natif"
chat_template_force = false
# lm_eval sur HF bf16, portable de 6 Go de VRAM : `auto` provoque des OOM CUDA. Valeur
# prudente (jamais `auto`), à confirmer par mesure.
lm_eval_batch_size = 4

