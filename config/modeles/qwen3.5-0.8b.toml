# Qwen3.5 0.8B (post-entraîné, Apache 2.0, sans accès conditionnel) : candidat de moins de
# 2B ajouté par décision d'Anaël du 2026-10-17 (spec-modeles-octobre-2026, « Candidats < 2B »).
# Révisions, SHA-256 et tailles relevés le même jour via l'API Hugging Face. AD-6 : valeurs
# communes à l'inférence et à l'entraînement.
# Même famille que qwen3.5-2b : VLM à attention hybride (Gated DeltaNet), 18 couches
# linear_attention sur 24, sous `text_config`. GGUF communautaire unsloth (Qwen ne publie pas
# de GGUF). Entraînable depuis la révision de D8 du 2026-10-18 (decisions.md,
# spec-qwen35-entrainable) : extra `gdn` requis, runs en `precision_base = "bf16"`.
# `multimodal = "geler-vision"` : tour vision chargée et gelée, LoRA sur `language_model`
# seul. `exclure_vision = true` ne règle que l'inférence du Harnais (aucun --mmproj).
# Raisonnement : le template n'ouvre <think> que si enable_thinking vaut true ; forcé à false.

schema_version = 1
depot_hf = "Qwen/Qwen3.5-0.8B"
revision = "2fc06364715b967f1860aea9cf38778875588b17"
fichiers = [
    "chat_template.jinja",
    "config.json",
    "merges.txt",
    "model.safetensors-00001-of-00001.safetensors",
    "model.safetensors.index.json",
    "preprocessor_config.json",
    "tokenizer.json",
    "tokenizer_config.json",
    "video_preprocessor_config.json",
    "vocab.json",
]
contexte = 8192
cache_kv = "f16"
reasoning = "off"
chat_template_kwargs = { enable_thinking = false }
exclure_vision = true
# Non sondé (sonde H-TOOLS 8.2) : natif par défaut.
protocole_outils = "natif"
# Template GGUF différent de celui du tokenizer HF (contrôle chat_template, run
# fetch/20261017-184442-modeles-29f5) : le template HF, exporté sous
# models/<slug>/chat_template.jinja, est imposé à llama-server.
chat_template_force = true
# lm_eval sur HF bf16, portable de 6 Go de VRAM : `auto` provoque des OOM CUDA. Valeur
# prudente (jamais `auto`), à confirmer par mesure.
lm_eval_batch_size = 2
# Candidat au fine-tuning (D8 révisé le 2026-10-18).
entrainable = true
multimodal = "geler-vision"
# Le template réécrit l'historique (ErreurMasque en `conversation` dès deux tours) : un exemple
# par tour (G1 à G4 sur le tokenizer réel). Avec enable_thinking = false, l'amorce de génération
# finit par un bloc de raisonnement vide que le template n'écrit pas dans un tour d'historique
# (comme MiniCPM5) : sans `bloc_amorce`, les 205 textes supervisés de v1 diffèrent de
# llama-server (story B2).
decoupage_masque = "par-tour"
bloc_amorce = "<think>\n\n</think>\n\n"
# Le template écrit ce bloc aussi dans les tours assistant qui suivent la dernière question :
# le contrôle « textes supervisés » compte ces blocs un à un au lieu de les retirer en bloc.
bloc_amorce_historique = true

