# conservée, plus aucun run à lancer.
# Gemma 4 E2B instruct (Google, Apache 2.0, sans accès conditionnel : vérifié le 2026-10-17
# par l'API Hugging Face, `gated` faux) : candidat ajouté par décision d'Anaël du 2026-10-17
# (spec-modeles-octobre-2026). Révisions, SHA-256 et tailles relevés le même jour. AD-6 :
# valeurs communes à l'inférence et à l'entraînement.
# Multimodal (vision et audio) : comme pour Ministral, tour vision et audio exclue, aucun
# --mmproj (le fichier gemma-4-E2B-it-mmproj.gguf n'est pas épinglé).
# Quantification du GGUF officiel : Q4_0 issue d'un entraînement QAT, et non Q4_K_M. L'étiquette
# `q4_k_m` de `eval run` désigne la section [gguf] : écart à noter dans le comparatif (comme
# Bonsai). Google ne publie pas de GGUF F16 officiel : pas de [gguf_f16] (à décider par Anaël).
# Le template active le raisonnement seulement si enable_thinking vaut true ; forcé à false.

