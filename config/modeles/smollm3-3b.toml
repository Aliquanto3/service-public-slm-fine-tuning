reasoning = "off"
chat_template_kwargs = { enable_thinking = false }
# Sonde H-TOOLS (story 8.2), run eval-sonde/20261012-165530-smollm3-3b-80cc : aucun
# protocole valide (0/5 appel apparié en natif comme en json-generique) ; natif retenu par
# égalité. En natif, les <tool_call> sortent en texte, non analysés par llama-server
# --jinja ; en json-generique, réponse en texte sans appel.
# Correctif du 2026-10-16 (spec-fix-smollm3-outils) : le template HF (AD-13) prescrit
# `<tool_call>{"name", "arguments"}</tool_call>` mais ne lit pas `message.tool_calls`, donc
# llama-server (b11429, PR #18675) ne construit aucun parseur d'outils. Le client analyse
# les balises du texte et réécrit l'historique ; le template reste celui du tokenizer.
# Constaté en génération v1.1 (eval-generation/20261016-193650-smollm3-3b-8a06) : 40/40
# items RD émettent ces balises en texte. À reconfirmer par la sonde 8.2.
protocole_outils = "balises-tool-call"
# Template GGUF différent de celui du tokenizer HF (SHA-256) : le template HF,
# exporté sous models/<slug>/chat_template.jinja, est imposé à llama-server.
chat_template_force = true

