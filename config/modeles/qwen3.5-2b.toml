# Qwen3.5 2B (post-entraîné, Apache 2.0, sans accès conditionnel) : ajouté par décision
# d'Anaël du 2026-10-17 (spec-modeles-octobre-2026). Révisions,
# SHA-256 et tailles relevés le 2026-10-17 via l'API Hugging Face. AD-6 : valeurs communes
# à l'inférence et à l'entraînement.
# VLM à attention hybride (Gated DeltaNet `linear_attention` + `full_attention`, 3 pour 1) :
# admis pour l'inférence et la Baseline seulement (décision D8 du 2026-10-17,
# decisions.md), d'où `entrainable = false` ; le contrôle `dense` passe à cette condition. Tour
# vision exclue comme pour Ministral : aucun --mmproj, aucun poids vision entraîné.
# GGUF communautaire réputé (unsloth) : Qwen ne publie pas de GGUF pour ce modèle.
# Raisonnement : le template n'ouvre <think> que si enable_thinking vaut true ; il est
# néanmoins forcé à false.

schema_version = 1
depot_hf = "Qwen/Qwen3.5-2B"
revision = "15852e8c16360a2fea060d615a32b45270f8a8fc"
fichiers = [
    "chat_template.jinja",
    "config.json",
    "merges.txt",
    "model.safetensors-00001-of-00001.safetensors",
    "model.safetensors.index.json",
    "preprocessor_config.json",
    "tokenizer.json",
    "tokenizer_config.json",
    "video_preprocessor_config.json",
    "vocab.json",
]
contexte = 8192
cache_kv = "f16"
reasoning = "off"
chat_template_kwargs = { enable_thinking = false }
exclure_vision = true
# Non sondé (sonde H-TOOLS 8.2 à lancer) : natif par défaut.
protocole_outils = "natif"
# Template GGUF différent de celui du tokenizer HF (contrôle chat_template, run
# fetch/20261017-052846-modeles-a55f) : le template HF, exporté sous
# models/<slug>/chat_template.jinja, est imposé à llama-server.
chat_template_force = true
# Baseline seulement (D8) : `train run` refuse ce modèle.
entrainable = false

