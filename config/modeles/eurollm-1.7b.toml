# EuroLLM 1.7B Instruct (UTTER, Apache 2.0, sans accès conditionnel) : candidat de moins de
# 2B ajouté par décision d'Anaël du 2026-10-17 (spec-modeles-octobre-2026, « Candidats < 2B »).
# Révisions, SHA-256 et tailles relevés le même jour via l'API Hugging Face. AD-6 : valeurs
# communes à l'inférence et à l'entraînement.
# Architecture `llama` dense, texte seul, 35 langues. Contexte de 4096 jetons, la valeur
# prudente : max_position_embeddings du config.json HF vaut 4096, mais l'en-tête du GGUF
# mradermacher annonce llama.context_length = 8192 ; inférieur à 8192, voir la spec.
# Pas de GGUF officiel : GGUF communautaire mradermacher (Q4_K_M et f16).
# Pas de mode raisonnement.

schema_version = 1
depot_hf = "utter-project/EuroLLM-1.7B-Instruct"
revision = "a25c7fa65fc2a644e6270b8940dbe295b51da681"
# Baseline seulement (décision d'Anaël du 2026-10-18, option D de spec-outils-rendu §4) : le
# template ignore 	ools et 	ool_calls, aucun protocole d'outils ne marche (sonde H-TOOLS), et
# la Baseline est la plus faible des candidats (RD 0, MMLU au niveau du hasard).
entrainable = false
fichiers = [
    "config.json",
    "generation_config.json",
    "model.safetensors",
    "special_tokens_map.json",
    "tokenizer.json",
    "tokenizer.model",
    "tokenizer_config.json",
]
contexte = 4096
cache_kv = "f16"
reasoning = "off"
exclure_vision = false
# Non sondé (sonde H-TOOLS 8.2) : natif par défaut.
protocole_outils = "natif"
# Template GGUF différent de celui du tokenizer HF (contrôle chat_template, run
# fetch/20261017-184442-modeles-29f5) : le template HF, exporté sous
# models/<slug>/chat_template.jinja, est imposé à llama-server.
chat_template_force = true
# lm_eval sur HF bf16, portable de 6 Go de VRAM : `auto` provoque des OOM CUDA. Valeur
# prudente (jamais `auto`), à confirmer par mesure.
lm_eval_batch_size = 2

