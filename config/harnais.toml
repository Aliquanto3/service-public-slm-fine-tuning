# Paramètres du Harnais de l'Assistant (story 4.2, D-nuit-A3-2).
# Créé par la story 4.2 ; les stories 4.3 (boucle d'outils, Modes) et 4.4 (comptes rendus
# longs) le lisent sans le modifier. `k` et le seuil de pertinence ne sont pas ici : ils
# restent dans config/index.toml (story 2.3), source unique, lue par slmsp.index.config.
schema_version = 1

# Boucle d'outils de la Recherche de données (story 4.3).
[outils]
# Nombre maximal de tours « appel d'outil puis résultat » avant d'arrêter la boucle.
iterations_max = 5
# Délai d'un appel MCP au-delà duquel on bascule sur l'Index local (« non vérifié en ligne »).
delai_appel_s = 10.0

# Sonde du Mode connecté (story 4.3) : `GET /health`.
[modes]
# Période de la sonde (5 min), en plus du démarrage et d'avant chaque appel d'outil.
periode_sonde_s = 300.0
# Délai maximal d'une sonde ; au-delà, le Mode reste hors ligne.
delai_sonde_s = 3.0

# Longueur de sortie des Tâches (correctif F2).
[generation]
# `max_tokens` par défaut d'une Tâche quand l'appelant n'en fixe pas (Q, RD, rédactions) :
# environ 700 mots, plusieurs paragraphes. Le compte rendu garde son plafond
# (`compte_rendu.reserve_sortie_tokens`). Le budget de prompt réserve cette sortie.
max_tokens = 1024
# Tâches qui réécrivent un texte d'entrée : plafond proportionnel au prompt mesuré,
# max(max_tokens, facteur × prompt + marge), borné par le contexte restant. Une traduction
# ou une correction rend à peu près la longueur de l'entrée ; 1,5 couvre le foisonnement.
reecriture = ["CO", "TR"]
facteur_reecriture = 1.5
marge_reecriture = 256
# Plafond fixe par Tâche (code), prioritaire sur les deux règles ci-dessus ; vide par défaut.
par_tache = {}

# Découpage des comptes rendus longs (story 4.4).
[compte_rendu]
# Tokens réservés à la sortie du modèle dans le contexte de chaque morceau.
reserve_sortie_tokens = 1024
# Paragraphes repris d'un morceau au suivant.
chevauchement_paragraphes = 1

# Vérification en ligne d'une page officielle (FR-12, story 13.5).
[verification]
# FR-12 active (Q7). À false, la vérification rend `indisponible` sans aucune requête.
active = true
# Délai maximal de la récupération de la page (connexion et lecture comprises).
delai_s = 10.0
# Taille maximale de la page, en octets ; au-delà, la lecture s'arrête (verdict indisponible).
taille_max_octets = 2000000
# Caractères du texte extrait de la page transmis au Modèle embarqué pour la comparaison.
caracteres_max_page = 8000
# Tokens maximaux de la réponse du Modèle embarqué.
max_tokens = 400

# Dédoublonnage du préfixe commun (titre + introduction) des passages d'une même page
# (story 16.2, harnais v2) : retiré des passages suivants, gardé dans le premier.
[dedoublonnage]
# Longueur minimale (caractères) du préfixe commun pour qu'il soit retiré.
prefixe_min_caracteres = 80

# Question sur une démarche (story 16.2, harnais v2) : nombre de passages demandés à l'Index,
# propre à Q (le `k` de Q). La Recherche de données et la génération de données gardent `k` de
# config/index.toml (5).
[question]
passages = 8

# Garde-fou anti-boucle du décodage (story 16.3, harnais v2 ; levier 5 du diagnostic D0).
# Arrêt déterministe, sans pénalité de répétition : une sortie qui ne boucle pas reste
# identique octet pour octet. La sortie coupée finit par `Fin(raison="boucle")`.
[anti_boucle]
actif = true
# Une même ligne non vide (alphanumérique) admise au plus ce nombre de fois ; à la suivante,
# la sortie est coupée au début de cette ligne. 12 : les emplacements répétés d'un courrier ou
# d'un formulaire (12 × « Nom : ........ ») passent.
repetitions_ligne_max = 12
# Part maximale de n-grammes de mots déjà vus sur les derniers `fenetre_mots` mots (les mots
# sans caractère alphanumérique, `|`, `---`, pointillés, ne comptent pas).
# Calage (revue 16.3, rejeu dev1, `outils/rejouer_anti_boucle.py`) : coupe les 13 boucles CT
# de v18 (CT-511 et CT-518, lignes vues 12 fois, par les n-grammes : 0,90 et 0,88 sur 300 mots)
# et aucune sortie de la Baseline MiniCPM5-2B ni des runs distants Qwen3.6-27B et Mistral Small.
# La fenêtre large écarte CR-515 de la Baseline (boucle de 2 lignes répétées 8 et 7 fois :
# 0,72 sur 300 mots, mais 0,74 sur 120 mots, au-dessus de CT-518 à 0,68).
fenetre_mots = 300
taille_ngramme = 4
part_ngrammes_max = 0.8

# Abstention de Q (story 16.8, harnais v2) : avant la réponse, un appel court au même modèle
# demande si les passages répondent à la question (`oui`/`non`, grammaire llama-server en local,
# lecture stricte pour un modèle externe). Sur `non`, la réponse est la phrase fixe d'abstention
# et l'orientation de config/prompts/q-abstention.toml. Désactivée par défaut (décision du
# 21/10 : Baseline v2 et essais de la nuit évalués sans abstention).
[q_abstention]
actif = false
# Tokens maximaux de l'appel de vérification.
max_tokens = 4
